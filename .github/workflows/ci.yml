name: CI

# Every platform NDM ships for: Windows x64 and ARM64, Linux x86_64 and aarch64 (AppImage, .deb, .rpm,
# .tar.gz, started on mainstream distributions), macOS (one app for Apple Silicon and Intel).
on:
  push:
    branches: [main, V-codex]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Clippy (no warnings)
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Real yt-dlp (DASH/HLS, parallel video/audio, no ffmpeg)
        shell: pwsh
        run: |
          $env:NDM_TEST_YTDLP = Join-Path $env:RUNNER_TEMP 'ndm-test-yt-dlp.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile $env:NDM_TEST_YTDLP
          cargo test --release real_ytdlp_separate_streams -- --ignored --test-threads=1
      - name: ffmpeg downloads and runs (Downloads -> Set yt-dlp)
        run: cargo test --release real_ffmpeg_install -- --ignored --test-threads=1
      - name: Language files are up to date
        run: python tools/ndm_lng.py --check
      - name: Extension video handoff
        run: node tools/test-extension.mjs
      - name: "NDM starts (no graphics card here: OpenGL, else wgpu with Windows' software renderer)"
        run: powershell -File tools\smoke-windows.ps1 target\release\ndm.exe
      - name: Browser downloads show only their own windows (tray, closed, minimized)
        run: powershell -File tools\tray-windows.ps1 target\release\ndm.exe
      - name: Installer builds
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q installer\ndm.iss

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Real yt-dlp (DASH/HLS, parallel video/audio, no ffmpeg)
        shell: pwsh
        run: |
          $env:NDM_TEST_YTDLP = Join-Path $env:RUNNER_TEMP 'ndm-test-yt-dlp.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_arm64.exe' -OutFile $env:NDM_TEST_YTDLP
          cargo test --release real_ytdlp_separate_streams -- --ignored --test-threads=1
      - name: ffmpeg downloads and runs (Downloads -> Set yt-dlp)
        run: cargo test --release real_ffmpeg_install -- --ignored --test-threads=1
      - name: NDM starts
        run: powershell -File tools\smoke-windows.ps1 target\release\ndm.exe

  linux:
    # built on Ubuntu 20.04 (glibc 2.31), so the AppImage and the packages start on it and every newer distribution
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config curl ca-certificates git file rsync patchelf \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-common dpkg-dev rpm ffmpeg
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Clippy (no warnings)
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Real yt-dlp (DASH/HLS, parallel video/audio, no ffmpeg)
        shell: bash
        run: |
          asset=yt-dlp_linux
          if [ "$(uname -m)" = aarch64 ]; then asset=yt-dlp_linux_aarch64; fi
          curl --fail --location --retry 3 "https://github.com/yt-dlp/yt-dlp/releases/latest/download/$asset" -o /tmp/ndm-test-yt-dlp
          chmod +x /tmp/ndm-test-yt-dlp
          NDM_TEST_YTDLP=/tmp/ndm-test-yt-dlp cargo test --release real_ytdlp_separate_streams -- --ignored --test-threads=1
          NDM_TEST_YTDLP=/tmp/ndm-test-yt-dlp cargo test --release real_ytdlp_audio_and_extras -- --ignored --test-threads=1
      - name: ffmpeg downloads and runs (Downloads -> Set yt-dlp)
        run: cargo test --release real_ffmpeg_install -- --ignored --test-threads=1
      - name: FFmpeg media integration (TS, HLS, MP4, MKV and synchronization)
        run: cargo test --release actual_media_ -- --ignored --test-threads=1
      - name: AppImage
        run: bash tools/appimage.sh
      - name: .deb, .rpm and .tar.gz
        run: bash tools/linux-packages.sh target/release/ndm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
          path: |
            installer/out/NDM-*.AppImage
            installer/out/ndm*.deb
            installer/out/ndm*.rpm
            installer/out/ndm*.tar.gz
            tools/smoke.sh

  smoke:
    # do the AppImage, the .deb / .rpm (installed with the distribution's package manager) and the
    # .tar.gz start on each mainstream distribution?
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, distro: 'ubuntu:20.04' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'ubuntu:22.04' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'ubuntu:24.04' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'debian:12' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'debian:13' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'fedora:latest' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'rockylinux:9' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'opensuse/leap:15.6' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'opensuse/tumbleweed' }
          - { arch: x86_64, runner: ubuntu-latest, distro: 'archlinux:latest' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, distro: 'ubuntu:20.04' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, distro: 'ubuntu:24.04' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, distro: 'debian:12' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, distro: 'fedora:latest' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, distro: 'opensuse/tumbleweed' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
      - name: Start NDM
        shell: bash
        run: |
          chmod +x installer/out/NDM-*.AppImage
          # the AppImage first, before a package or the .tar.gz brings GTK in
          bash tools/smoke.sh installer/out/NDM-*.AppImage installer/out/*.deb installer/out/*.rpm installer/out/*.tar.gz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Real yt-dlp (DASH/HLS, parallel video/audio, no ffmpeg)
        run: |
          curl --fail --location --retry 3 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o /tmp/ndm-test-yt-dlp
          chmod +x /tmp/ndm-test-yt-dlp
          NDM_TEST_YTDLP=/tmp/ndm-test-yt-dlp cargo test --release real_ytdlp_separate_streams -- --ignored --test-threads=1
      - name: ffmpeg downloads and runs (Downloads -> Set yt-dlp)
        run: cargo test --release real_ffmpeg_install -- --ignored --test-threads=1
      - name: NDM.app and the disk image (Apple Silicon and Intel)
        run: bash tools/macos.sh
      - name: NDM starts
        run: bash tools/smoke-macos.sh installer/out/NDM-*-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: installer/out/NDM-*-macOS.dmg
