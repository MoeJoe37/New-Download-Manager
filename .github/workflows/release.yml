# Push a tag vX.Y.Z (matching Cargo.toml's version), or run it by hand on a branch with a tag name, and
# this builds ndm.exe, the Windows installer and the
# Linux AppImage and attaches them to that tag's GitHub release (created if missing). NDM's "Check for
# updates" picks ndm.exe / the AppImage from the latest release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.1.0 (created at the commit this runs on if it doesn't exist)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$TAG" ] || { echo "Cargo.toml says $v, tag is $TAG"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ndm.iss
          Copy-Item target\release\ndm.exe installer\out\ndm.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/out/*

  linux:
    # built on Ubuntu 20.04 (glibc 2.31): the AppImage then starts on it and every newer distribution
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config curl ca-certificates git file rsync patchelf \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-common
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tools/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: installer/out/NDM-x86_64.AppImage

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          # hand-written notes (.github/release-notes/vX.Y.Z.md) are what NDM's update window shows
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "New Download Manager ${TAG#v}" "$@"
          [ -f "$notes" ] && gh release edit "$TAG" --notes-file "$notes"
          gh release upload "$TAG" out/* --clobber
